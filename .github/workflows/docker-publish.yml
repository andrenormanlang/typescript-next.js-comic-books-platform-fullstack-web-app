name: Build and Push Docker image
on:
    push:
        branches: ["main"]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: docker/dockerfile
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/retropop:latest
                  platforms: linux/amd64
                  cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/retropop:cache
                  cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/retropop:cache,mode=max
                  # Map required build args from GitHub Secrets so the Dockerfile can validate/build
                  build-args: |
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
